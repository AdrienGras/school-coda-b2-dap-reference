flysystem:
    storages:
        # un stockage par type de document : changer de support se fait ici, type par type
        profile_pictures.storage:
            adapter: 'local'
            options:
                directory: '%kernel.project_dir%/storage/profile_pictures'
                # le conteneur écrit en root : sans ce droit, le dossier est illisible depuis
                # votre machine
                permissions:
                    dir: { public: 0o755, private: 0o755 }
